# Extended Kalman Filter configuration for sensor fusion
# Fuses rf2o laser odometry with RealSense D455 IMU (orientation + angular velocity only).
# IMU linear accelerations are excluded: RealSense D455 MEMS accelerometer is too noisy
# (~±0.1 m/s² at rest vs ~1.5 m/s² peak) for reliable double-integration into position.
# Legacy Arduino IMU remains available on /imu/arduino for fallback/debug.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    # Frame configuration
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Odometry configuration (laser scan matching via rf2o - zamjena za wheel enkodere)
    odom0: /odom_rf2o
    odom0_config: [
        true,
        true,
        false, # x, y, z positions
        false,
        false,
        true, # roll, pitch, yaw orientations
        true,
        true,
        false, # x, y, z velocities
        false,
        false,
        true, # roll, pitch, yaw velocities
        false,
        false,
        false,
      ] # x, y, z accelerations
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    # IMU configuration (RealSense D455 - samo orijentacija i kutne brzine)
    # Akceleracije isključene: MEMS akcelerometar D455 ima previsok šum za EKF fusiju.
    imu0: /imu/data
    imu0_config: [
        false,
        false,
        false, # x, y, z positions
        true,
        true,
        true, # roll, pitch, yaw orientations
        false,
        false,
        false, # x, y, z velocities
        true,
        true,
        true, # roll, pitch, yaw velocities
        false,
        false,
        false,
      ] # x, y, z accelerations - ISKLJUCENO (preveliki sum)
    imu0_queue_size: 10
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true

    # Process noise covariance (Q matrix)
    process_noise_covariance:
