# Extended Kalman Filter configuration for sensor fusion
# Fuses rf2o laser odometry position with RealSense D455 IMU yaw-rate support.
# RF2O yaw/twist is intentionally not fused: the 2026-06-21 driving bags showed
# scan-matching angular spikes around +/-1.8 rad/s while the robot command/IMU
# stayed below about +/-0.45 rad/s, which made Nav2 over-correct turns.
# IMU linear accelerations are excluded: RealSense D455 MEMS accelerometer is too noisy
# (~±0.1 m/s² at rest vs ~1.5 m/s² peak) for reliable double-integration into position.
# Legacy Arduino IMU remains available on /imu/arduino for fallback/debug.

ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    publish_tf: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    # Frame configuration
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Odometry configuration (laser scan matching via rf2o).
    # Use RF2O for x/y position only. Let the gyro own yaw-rate so local TF does
    # not jump during in-place or tight rotations.
    odom0: /odom_rf2o
    odom0_config: [
      true,
      true,
      false,  # x, y, z positions
      false,
      false,
      false,  # roll, pitch, yaw orientations
      false,
      false,
      false,  # x, y, z velocities
      false,
      false,
      false,  # roll, pitch, yaw velocities
      false,
      false,
      false,
    ]  # x, y, z accelerations
    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    # IMU configuration (RealSense D455 gyro transformed from optical frame to base_link).
    # Akceleracije iskljucene: MEMS akcelerometar D455 ima previsok sum za EKF fusiju.
    imu0: /imu/base_link
    imu0_config: [
      false,
      false,
      false,  # x, y, z positions
      false,
      false,
      false,  # roll, pitch, yaw orientations (D455 nema magnetometar, yaw je relativan - ne koristimo)
      false,
      false,
      false,  # x, y, z velocities
      false,
      false,
      true,  # roll, pitch, yaw velocities - use gyro yaw-rate to stabilize rotations
      false,
      false,
      false,
    ]  # x, y, z accelerations - ISKLJUCENO (preveliki sum)
    imu0_queue_size: 10
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true

    # Process noise covariance (Q matrix)
