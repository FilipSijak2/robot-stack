# Optional Nav2 Costmap Filter template for keepout and speed zones.
#
# This template is not active until:
#   1. A filter mask map is created and saved as a .pgm/.yaml pair.
#   2. A filter mask Map Server is launched.
#   3. Costmap Filter Info Server is launched.
#   4. keepout_filter / speed_filter are added to the relevant costmap filter chain.
#
# Recommended for final demo map after base navigation is stable.

# Map server for keepout mask.
# The mask image should use normal map_server format, but pixel values represent zones,
# not physical obstacles. White/black values depend on map mode and thresholds.
keepout_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/maps/keepout_mask.yaml"
    topic_name: "/keepout_filter_mask"
    frame_id: "map"

# Map server for speed mask.
speed_filter_mask_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: "/maps/speed_mask.yaml"
    topic_name: "/speed_filter_mask"
    frame_id: "map"

# Filter info for keepout zones.
# type 0 is commonly used for keepout-style filters in Nav2 examples.
keepout_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 0
    filter_info_topic: "/costmap_filter_info/keepout"
    mask_topic: "/keepout_filter_mask"
    base: 0.0
    multiplier: 1.0

# Filter info for speed zones.
# Check the deployed Nav2 distro docs before enabling; speed filter type/value mapping
# differs by filter mode. Keep this as a template until validated on the robot.
speed_costmap_filter_info_server:
  ros__parameters:
    use_sim_time: false
    type: 1
    filter_info_topic: "/costmap_filter_info/speed"
    mask_topic: "/speed_filter_mask"
    base: 0.0
    multiplier: 1.0

