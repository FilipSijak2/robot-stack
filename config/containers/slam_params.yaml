slam_toolbox:
  ros__parameters:
    # Basic parameters
    use_sim_time: false
    map_file_name: "my_map"
    resolution: 0.03
    # Ensure the map is published so /map topic exists
    publish_map: true
    # Frame configuration (needed for proper transforms & map publication)
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    # Periodic publishing of OccupancyGrid (slam_toolbox params)
    periodic_publish: true
    periodic_publish_frequency: 1.0 # Hz
    # Localization mode: track pose on existing map; no map updates, no loop closures.
    # Mapping is done separately via run_mapping.sh which starts its own slam_toolbox instance.
    mode: localization

    # Sensor parameters
    minimum_laser_range: 0.2
    max_laser_range: 10.0
    minimum_time_interval: 0.1 # Brže procesiranje pri rotaciji smanjuje drift
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    message_filter_queue_size: 100 # Veći queue: sprječava 'discarding message because the queue is full'

    # Performance optimization
    stack_size_to_use: 40000000
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.17 # ~10 degrees

    # Loop closure parameters (disabled in localization mode; run_mapping.sh override enables it for mapping)
    loop_search_maximum_distance: 2.5
    do_loop_closing: true
    loop_match_minimum_chain_size: 10  # Manji stan: 10 umjesto 15, brza potvrda zatvorene petlje
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35

    # Correlation parameters - grublja rezolucija smanjuje pretraživanje ~4x
    # (0.02 umjesto 0.01 → 50x50 umjesto 100x100 po kutu)
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.02
    correlation_search_space_smear_deviation: 0.1

    # Scan matcher parameters
    coarse_search_angle_offset: 0.349 # 20 degrees
    coarse_angle_resolution: 0.0349 # 2 degrees
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
