slam_toolbox:
  ros__parameters:
    # Basic parameters
    use_sim_time: false
    map_file_name: "my_map"
    resolution: 0.05
    # Ensure the map is published so /map topic exists
    publish_map: true
    # Frame configuration (needed for proper transforms & map publication)
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan
    # Periodic publishing of OccupancyGrid (slam_toolbox params)
    periodic_publish: true
    periodic_publish_frequency: 1.0 # Hz
    # Provide an initial mode (mapping|localization)
    mode: mapping

    # Sensor parameters
    minimum_laser_range: 0.2
    max_laser_range: 10.0
    minimum_time_interval: 0.2 # Bez enkodera, češće procesiranje smanjuje drift rf2o
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # Performance optimization
    stack_size_to_use: 40000000
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.17 # ~10 degrees

    # Loop closure parameters
    # Manji search radius i veći chain size = rjeđe ali pouzdanije loop closures,
    # i manji CPU spike na RPi 5.
    loop_search_maximum_distance: 2.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 15
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35

    # Correlation parameters - grublja rezolucija smanjuje pretraživanje ~4x
    # (0.02 umjesto 0.01 → 50x50 umjesto 100x100 po kutu)
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.02
    correlation_search_space_smear_deviation: 0.1

    # Scan matcher parameters
    coarse_search_angle_offset: 0.349 # 20 degrees
    coarse_angle_resolution: 0.0349 # 2 degrees
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
