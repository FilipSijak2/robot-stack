# Optional Nav2 Collision Monitor template for Devastator robot.
#
# This file is not active until the collision_monitor node is launched and the
# cmd_vel chain is rewired. Suggested command chain:
#
#   Nav2 /cmd_vel_auto
#     -> cmd_vel_mux or velocity_smoother
#     -> collision_monitor input topic
#     -> cmd_vel_safety_filter
#     -> robot_bridge /cmd_vel
#
# Start with /scan_filtered only. Add RealSense PointCloud2 later if needed.

collision_monitor:
  ros__parameters:
    enabled: true
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"

    # Input should be the already smoothed/muxed velocity command.
    # Do not point this directly to the final /cmd_vel if robot_bridge already subscribes to /cmd_vel,
    # otherwise you can create a feedback/command conflict.
    cmd_vel_in_topic: "/cmd_vel_safety_in"
    cmd_vel_out_topic: "/cmd_vel_collision_checked"
    state_topic: "/collision_monitor_state"

    transform_tolerance: 0.2
    source_timeout: 0.4
    base_shift_correction: true
    stop_pub_timeout: 1.0

    # For ROS 2 Humble/Jazzy-style Twist topics this should normally remain false.
    # Set to true only if the stack uses TwistStamped command velocities.
    enable_stamped_cmd_vel: false
    use_realtime_priority: false

    # Initial conservative safety zones for a small differential-drive robot.
    # X is forward from base_link, Y is left/right.
    polygons: ["front_stop", "front_slow", "rear_stop", "footprint_approach"]

    front_stop:
      type: "polygon"
      points: [0.34, 0.16, 0.34, -0.16, 0.06, -0.16, 0.06, 0.16]
      action_type: "stop"
      max_points: 1
      visualize: true
      polygon_pub_topic: "/collision_monitor/front_stop"
      enabled: true

    front_slow:
      type: "polygon"
      points: [0.70, 0.28, 0.70, -0.28, 0.10, -0.28, 0.10, 0.28]
      action_type: "slowdown"
      slowdown_ratio: 0.35
      max_points: 2
      visualize: true
      polygon_pub_topic: "/collision_monitor/front_slow"
      enabled: true

    rear_stop:
      type: "polygon"
      points: [-0.08, 0.16, -0.08, -0.16, -0.28, -0.16, -0.28, 0.16]
      action_type: "stop"
      max_points: 1
      visualize: true
      polygon_pub_topic: "/collision_monitor/rear_stop"
      enabled: true

    footprint_approach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.02
      max_points: 3
      visualize: false
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_filtered"
      source_timeout: 0.25
      enabled: true

    # Optional later experiment if the RealSense pointcloud is stable and CPU allows it.
    # pointcloud:
    #   type: "pointcloud"
    #   topic: "/camera/realsense/depth/color/points"
    #   transport_type: "raw"
    #   min_height: 0.05
    #   max_height: 1.0
    #   min_range: 0.08
    #   source_timeout: 0.5
    #   enabled: true
