# ROS2 logging configuration for robot system
# Place this in /opt/ros/humble/share/rcl_logging_spdlog/config/

version: 1
disable_existing_loggers: false

formatters:
  detailed:
    format: '[{asctime}] [{levelname:<8}] [{name}] {message}'
    style: '{'
  simple:
    format: '[{levelname:<8}] {name}: {message}'
    style: '{'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
    
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: /srv/logs/robot.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    
  error_file:
    class: logging.handlers.RotatingFileHandler
    level: ERROR
    formatter: detailed
    filename: /srv/logs/robot_errors.log
    maxBytes: 10485760  # 10MB
    backupCount: 5

loggers:
  rclcpp:
    level: INFO
    handlers: [console, file]
    propagate: no
    
  nav2:
    level: INFO
    handlers: [console, file, error_file]
    propagate: no
    
  slam_toolbox:
    level: INFO
    handlers: [console, file]
    propagate: no
    
  robot_localization:
    level: INFO
    handlers: [console, file]
    propagate: no
    
  micro_ros_agent:
    level: DEBUG
    handlers: [console, file, error_file]
    propagate: no

root:
  level: INFO
  handlers: [console, file]

# Daily Docker/container log collector configuration.
# The collector writes each container's stdout/stderr stream into:
#   /logs/<day>/<container_name>.log
# Example day folder: 23-3-2026
container_logging:
  enabled: true
  log_dir: /logs
  state_file: /logs/.container-log-state.json
  date_folder_format: "%-d-%-m-%Y"
  scan_interval_seconds: 5
  reconnect_delay_seconds: 3
  include_containers: []
  exclude_containers: []
