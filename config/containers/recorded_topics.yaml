# List ROS topics to record, one per line as a YAML array.
# RealSense topics use the /camera/realsense/ prefix (RS_CAMERA_NAME=realsense
# inside a namespace=camera container).
# `/imu/data` is the filtered RealSense IMU in camera optical axes.
# `/imu/base_link` is the transformed gyro topic used by motor assist/debug.
# `/imu/base_link_corrected` is bias-corrected yaw-rate fused into EKF.
# `/imu/arduino` is kept as a legacy fallback/debug stream.
- /scan
- /wheel_odom
- /odom_rf2o
- /odometry/filtered
- /tf
- /tf_static
- /map
- /amcl_pose
- /robot_pose_map
- /particle_cloud
- /cmd_vel
- /cmd_vel_auto
- /cmd_vel_nav
- /cmd_vel_smoothed
- /cmd_vel_safety_in
- /cmd_vel_safety_status
- /manual_mode
- /cmd_vel_collision_in
- /collision_monitor_state
- /imu/data
- /imu/base_link
- /imu/base_link_corrected
- /imu/arduino
- /camera/realsense/imu
- /scan_filtered
- /camera/realsense/color/image_compressed
- /camera/realsense/color/image_raw/compressed
- /camera/realsense/color/camera_info
- /camera/realsense/aligned_depth_to_color/image_raw
- /camera/realsense/aligned_depth_to_color/camera_info
- /camera/realsense/imu/gyro
- /camera/realsense/imu/accel
- /cmd_vel_joy
- /robot_status
- /pose
# Nav2 global path.
- /plan
- /local_plan
- /global_costmap/published_footprint
# Jetson anomaly pipeline outputs, published back through rosbridge.
- /anomaly/events
- /anomaly/events/readable
- /anomaly/markers
- /anomaly/debug_image/compressed
- /anomaly/map_snapshot/compressed
