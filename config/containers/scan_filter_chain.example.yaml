# Optional LaserScan denoise filter chain.
#
# Goal:
#   /scan -> laser_filters -> /scan_filtered
#
# Nav2 already consumes /scan_filtered in the current configuration, so this
# template makes that topic explicit and reproducible.
#
# Recommended ROS package:
#   ros-${ROS_DISTRO}-laser-filters
#
# Suggested node:
#   scan_to_scan_filter_chain from laser_filters
#
# Notes:
# - Start with range and shadow filtering only.
# - Add angular bounds only if the robot body or cables are visible in the scan.
# - Validate every filter in Foxglove/RViz before using it for autonomous driving.

scan_to_scan_filter_chain:
  ros__parameters:
    filter_chain:
      # Remove invalid or physically unreliable readings.
      - name: range
        type: laser_filters/LaserScanRangeFilter
        params:
          lower_threshold: 0.12
          upper_threshold: 8.0
          lower_replacement_value: .nan
          upper_replacement_value: .nan

      # Remove isolated edge/shadow artifacts that often appear near object edges.
      # If this removes too much real geometry, disable this filter first.
      - name: shadow
        type: laser_filters/ScanShadowsFilter
        params:
          min_angle: 10.0
          max_angle: 170.0
          neighbors: 20
          window: 1

      # Optional: enable only if part of the robot chassis appears in the scan.
      # - name: angular_bounds
      #   type: laser_filters/LaserScanAngularBoundsFilter
      #   params:
      #     lower_angle: -2.8
      #     upper_angle: 2.8

# Example launch concept:
#
# ros2 run laser_filters scan_to_scan_filter_chain \
#   --ros-args \
#   -r scan:=/scan \
#   -r scan_filtered:=/scan_filtered \
#   --params-file /config/scan_filter_chain.yaml
