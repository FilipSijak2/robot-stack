# Active Nav2 Collision Monitor configuration for muxed manual/auto cmd_vel.
#
# Command chain:
#   Nav2 /cmd_vel_auto or teleop /cmd_vel_joy
#     -> cmd_vel_mux
#     -> /cmd_vel_collision_in
#     -> collision_monitor
#     -> robot_bridge /cmd_vel
#
# The monitor uses /scan_filtered as the fast last-line stop/slow source. Nav2
# autonomous driving still uses local/global costmaps with static map, LaserScan,
# RealSense pointcloud, AI obstacle pointcloud, footprint critics, and inflation.

collision_monitor:
  ros__parameters:
    enabled: true
    use_sim_time: false
    base_frame_id: "base_link"
    odom_frame_id: "odom"

    cmd_vel_in_topic: "/cmd_vel_collision_in"
    cmd_vel_out_topic: "/cmd_vel"
    state_topic: "/collision_monitor_state"

    # Latest bags showed intermittent scan->base_link future extrapolation
    # around recovery turns. Keep the monitor active, but allow modest TF lag.
    transform_tolerance: 0.5
    source_timeout: 0.7
    base_shift_correction: true
    stop_pub_timeout: 1.0
    enable_stamped_cmd_vel: false
    use_realtime_priority: false

    polygons: ["front_stop", "front_slow", "rear_stop", "footprint_approach"]

    front_stop:
      type: "polygon"
      points: [0.27, 0.14, 0.27, -0.14, 0.06, -0.14, 0.06, 0.14]
      action_type: "stop"
      max_points: 2
      visualize: true
      polygon_pub_topic: "/collision_monitor/front_stop"
      enabled: true

    front_slow:
      type: "polygon"
      points: [0.50, 0.21, 0.50, -0.21, 0.10, -0.21, 0.10, 0.21]
      action_type: "slowdown"
      # Keep a warning zone, but do not starve in-place rotations of torque.
      # With 0.55 the 2026-06-21 180-degree turn bags were reduced to ~0.13
      # rad/s and the drivetrain stalled.
      slowdown_ratio: 0.90
      # Require a small cluster before slowdown so scan speckles do not keep
      # toggling velocity while Nav2 is trying to finish a goal.
      max_points: 6
      visualize: true
      polygon_pub_topic: "/collision_monitor/front_slow"
      enabled: true

    rear_stop:
      type: "polygon"
      points: [-0.08, 0.15, -0.08, -0.15, -0.26, -0.15, -0.26, 0.15]
      action_type: "stop"
      max_points: 1
      visualize: true
      polygon_pub_topic: "/collision_monitor/rear_stop"
      enabled: true

    footprint_approach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "/local_costmap/published_footprint"
      time_before_collision: 1.5
      simulation_time_step: 0.02
      max_points: 5
      visualize: false
      enabled: true

    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan_filtered"
      source_timeout: 0.6
      enabled: true
