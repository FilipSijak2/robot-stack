static_transforms:
  # Sensor mount transforms only.
  # Dynamic odom -> base_link must come from robot_localization EKF.
  # map -> odom remains owned by slam_toolbox.
  #
  # base_link convention in this stack:
  # - base_link is rigidly attached to robot body (does not move relative to robot)
  # - base_link pose changes in odom/map as robot moves (published by EKF)
  # - robot center is at footprint center, approximately 5 cm above ground

  # Lidar mount transform (translation in meters, rotation RPY in radians)
  - parent: base_link
    child: laser
    translation: [0.0, 0.02, 0.18]   # x, y, z (lidar: x=0, y=+2cm, z=+18cm from base_link)
    rotation_rpy: [0.0, 0.0, 0.0]    # roll, pitch, yaw

  # Camera mount (adjust translation & rotation_rpy to real mount position)
  - parent: base_link
    child: rpi_cam_link
    translation: [0.10, 0.00, 0.35]   # 10cm forward, 35cm up
    rotation_rpy: [0.0, 0.0, 0.0]

  # Optical frame (REP 103: Z forward, X right, Y down)
  - parent: rpi_cam_link
    child: rpi_cam_optical_frame
    translation: [0.0, 0.0, 0.0]
    rotation_rpy: [-1.5708, 0.0, -1.5708]

  # Physical mount of the RealSense body relative to the robot base.
  - parent: base_link
    child: realsense_link
    translation: [0.0, 0.08, 0.10]   # x, y, z (realsense: x=0, y=+8cm, z=+10cm from base_link)
    rotation_rpy: [0.0, 0.0, 0.0]

  # Alias from the logical mount frame to the actual RealSense driver root.
  # In the current runtime the driver prefixes frames with RS_CAMERA_NAME,
  # so the visible TF root becomes `realsense_realsense_link`.
  - parent: realsense_link
    child: realsense_realsense_link
    translation: [0.0, 0.0, 0.0]
    rotation_rpy: [0.0, 0.0, 0.0]
