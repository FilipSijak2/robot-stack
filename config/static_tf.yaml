static_transforms:
  # Identity odom -> base_link so SLAM can build map (replace later with real wheel odom TF)
  - parent: odom
    child: base_link
    translation: [0.0, 0.0, 0.0]
    rotation_rpy: [0.0, 0.0, 0.0]
  # Placeholder transform laser -> base_link (translation in meters, rotation RPY in radians)
  - parent: base_link
    child: laser
    translation: [0.0, 0.05, 0.10]   # x, y, z (placeholder: laser 5cm to the left, 10cm above base_link)
    rotation_rpy: [0.0, 0.0, 0.0]    # roll, pitch, yaw

  # Camera mount (adjust translation & rotation_rpy to real mount position)
  - parent: base_link
    child: rpi_cam_link
    translation: [0.10, 0.00, 0.35]   # 10cm forward, 35cm up
    rotation_rpy: [0.0, 0.0, 0.0]

  # Optical frame (REP 103: Z forward, X right, Y down)
  - parent: rpi_cam_link
    child: rpi_cam_optical_frame
    translation: [0.0, 0.0, 0.0]
    rotation_rpy: [-1.5708, 0.0, -1.5708]

  # Physical mount of the RealSense body relative to the robot base.
  - parent: base_link
    child: realsense_link
    translation: [0.12, 0.00, 0.32]
    rotation_rpy: [0.0, 0.0, 0.0]

  # Alias from the logical mount frame to the actual RealSense driver root.
  # In the current runtime the driver prefixes frames with RS_CAMERA_NAME,
  # so the visible TF root becomes `realsense_realsense_link`.
  - parent: realsense_link
    child: realsense_realsense_link
    translation: [0.0, 0.0, 0.0]
    rotation_rpy: [0.0, 0.0, 0.0]
