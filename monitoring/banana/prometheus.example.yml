global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "rpi5_robot_node_exporter"
    scrape_interval: 15s
    static_configs:
      # Replace with the current Raspberry Pi Tailscale IP or MagicDNS name.
      # Historical examples from this project included 100.115.192.116 for raspberry-1.
      - targets: ["100.115.192.116:9100"]
        labels:
          instance: "rpi5-robot"
          device: "raspberry-pi-5"
