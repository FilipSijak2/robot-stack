# Monitoring stack for Banana Pi.
#
# Runs Prometheus + Grafana on Banana Pi and scrapes metrics from Raspberry Pi over Tailscale.
# This keeps storage and dashboard load away from the robot.
#
# Usage on Banana Pi:
#   cd monitoring/banana
#   cp prometheus.example.yml prometheus.yml
#   # Edit prometheus.yml and set the RPi Tailscale IP/DNS.
#   docker compose -f docker-compose.monitoring.yaml up -d
#
# Grafana:    http://<banana-pi-tailscale-ip>:3000
# Prometheus: http://<banana-pi-tailscale-ip>:9090

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: banana_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=14d"
      - "--storage.tsdb.retention.size=4GB"
      - "--web.enable-lifecycle"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:11.2.2
    container_name: banana_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus_data:
  grafana_data:
