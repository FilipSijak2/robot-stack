services:

  # Navigation Stack
  nav_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/nav:${NAV_TAG}
    container_name: nav_cont
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      - ENABLE_CMD_VEL_MUX=1
      - ENABLE_JOYSTICK=1
      - JOYSTICK_DEV=/dev/input/js0
      - CMD_VEL_AUTO=/cmd_vel_auto
      - CMD_VEL_JOY=/cmd_vel_joy
      - CMD_VEL_OUT=/cmd_vel
      - MANUAL_DEFAULT=false
      - MANUAL_TIMEOUT_S=0.5
      - MAP_FILE=${MAP_FILE:-}
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - ./config/nav2_params.yaml:/app/nav2_params.yaml
      - ./config/map.yaml:/app/map.yaml:ro
      - ./srv:/srv
      - /dev/input:/dev/input:ro
    privileged: true
    depends_on:
      - database_cont
      - slam_cont
      - rosbridge_websocket
      - sensor_fusion_cont
      - robot_bridge
    restart: always

  # Database
  database_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/db:${DB_TAG}
    container_name: database_cont
    network_mode: host
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /srv/db
    volumes:
      - ./srv:/srv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # Laser Driver
  laser_driver:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/laser_driver:${DRIVER_TAG}
    container_name: laser_driver_cont
    environment:
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
    devices:
      - "${LIDAR_DEVICE:-/dev/ttyUSB0}:${LIDAR_DEVICE:-/dev/ttyUSB0}"
    group_add:
      - dialout
    network_mode: host
    depends_on:
      - database_cont
    restart: always

  # SLAM
  slam_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/slam:${SLAM_TAG}
    container_name: slam_cont
    network_mode: host
    depends_on:
      - database_cont
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - ./config/slam_params.yaml:/app/slam_params.yaml
      - ./srv:/srv
      - ./config/static_tf.yaml:/app/static_tf.yaml
    environment:
      - MAP_ROOT=${MAP_ROOT}
      - DB_HOST=localhost
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      - STATIC_TF_FILE=/app/static_tf.yaml
      - PUBLISH_LASER_STATIC_TF=0
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f slam_toolbox >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  # Sensor Fusion
  sensor_fusion_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/sensor_fusion:${SENSOR_FUSION_TAG}
    container_name: sensor_fusion_cont
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      - SF_IMU_SOURCE=${SF_IMU_SOURCE:-realsense}
      - SF_IMU_INPUT_TOPIC=${SF_IMU_INPUT_TOPIC:-/camera/realsense/imu}
      - SF_IMU_OUTPUT_TOPIC=${SF_IMU_OUTPUT_TOPIC:-/imu/data}
      - SF_EKF_CONFIG=/app/robot_localization.yaml
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - ./config/robot_localization.yaml:/app/robot_localization.yaml
    depends_on:
      - database_cont
      - realsense_cont
      - slam_cont
      - robot_bridge
    restart: always

  # Robot Bridge (legacy serial mode + optional RPi direct mode)
  robot_bridge:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/bridge:${BRIDGE_TAG}
    container_name: robot_bridge_cont
    network_mode: host
    environment:
      - BRIDGE_MODE=${BRIDGE_MODE:-serial_legacy}
      - SERIAL_PORT=${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}
      - SERIAL_BAUD=${BRIDGE_SERIAL_BAUD:-115200}
      - IMU_TOPIC=${BRIDGE_IMU_TOPIC:-/imu/arduino}
      - I2C_BUS=${BRIDGE_I2C_BUS:-1}
      - I2C_MUX_ADDR=${BRIDGE_I2C_MUX_ADDR:-0x70}
      - AS5600_ADDR=${BRIDGE_AS5600_ADDR:-0x36}
      - LEFT_MUX_CHANNEL=${BRIDGE_LEFT_MUX_CHANNEL:-0}
      - RIGHT_MUX_CHANNEL=${BRIDGE_RIGHT_MUX_CHANNEL:-4}
      - DRV_AIN1_PIN=${BRIDGE_DRV_AIN1_PIN:-18}
      - DRV_AIN2_PIN=${BRIDGE_DRV_AIN2_PIN:-23}
      - DRV_BIN1_PIN=${BRIDGE_DRV_BIN1_PIN:-19}
      - DRV_BIN2_PIN=${BRIDGE_DRV_BIN2_PIN:-24}
      - DRV_SLEEP_PIN=${BRIDGE_DRV_SLEEP_PIN:--1}
      - WHEEL_RADIUS_M=${BRIDGE_WHEEL_RADIUS_M:-0.033}
      - WHEEL_BASE_M=${BRIDGE_WHEEL_BASE_M:-0.20}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
    devices:
      - "${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}:${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}"
      - "${BRIDGE_I2C_DEVICE:-/dev/i2c-1}:${BRIDGE_I2C_DEVICE:-/dev/i2c-1}"
      - "${BRIDGE_GPIOMEM_DEVICE:-/dev/gpiomem}:${BRIDGE_GPIOMEM_DEVICE:-/dev/gpiomem}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'pgrep -f \"robot_serial_bridge|robot_rpi_direct_bridge\" >/dev/null || exit 1'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 8s
    restart: always

  # AI Kit
  ai_kit_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/ai_kit:${AI_KIT_TAG}
    container_name: ai_kit_cont
    environment:
      - DISPLAY=${DISPLAY:-}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-}
      - UDEV=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      # Set to 0 to run in passthrough mode (republish images without AI inference).
      # Set to 1 and configure HAILO_GST_PIPELINE to enable Hailo inference.
      # Example pipeline for yolov8 detection on Hailo-8L:
      #   HAILO_GST_PIPELINE=appsrc name=ros_src ! videoconvert !
      #     hailonet hef-path=/root/hailo-rpi5-examples/resources/yolov8s_h8l.hef !
      #     hailofilter so-path=/usr/lib/hailo-post-processes/libyolo_hailortpp_post.so !
      #     appsink name=ros_sink emit-signals=true
      - AI_KIT_REQUIRE_HAILO=0
      - HAILO_GST_PIPELINE=${HAILO_GST_PIPELINE:-}
    devices:
      - /dev/dri:/dev/dri
      - /dev:/dev
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - /lib/firmware:/lib/firmware
      - /run/udev:/run/udev:ro
      # Hailo runtime from host (installed via 'sudo apt install hailo-all').
      # Mounts the prebuilt libs directly â€” no downloading inside the container.
      - /usr/lib/libhailort.so:/usr/lib/libhailort.so:ro
      - /usr/lib/hailo:/usr/lib/hailo:ro
      - /usr/lib/aarch64-linux-gnu/libhailort.so.4:/usr/lib/aarch64-linux-gnu/libhailort.so.4:ro
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgsthailo.so:/usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgsthailo.so:ro
      - /usr/lib/python3/dist-packages/hailort:/usr/lib/python3/dist-packages/hailort:ro
      - /usr/lib/python3/dist-packages/hailo_tappas_core_python_binding:/usr/lib/python3/dist-packages/hailo_tappas_core_python_binding:ro
      - hailo_examples_data:/root/hailo-rpi5-examples
    privileged: true
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    group_add:
      - 44
    restart: always

  # ROS Bridge WebSocket
  rosbridge_websocket:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/rosbridge:${ROSBRIDGE_TAG}
    container_name: rosbridge_websocket_cont
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
    network_mode: host
    restart: always

  # Foxglove Bridge (WebSocket UI endpoint)
  foxglove_bridge:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/foxglove_bridge:${FOXGLOVE_BRIDGE_TAG}
    container_name: foxglove_bridge_cont
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      - FOXGLOVE_PORT=${FOXGLOVE_PORT:-8765}
      - FOXGLOVE_ADDRESS=${FOXGLOVE_ADDRESS:-0.0.0.0}
      - FOXGLOVE_TLS=${FOXGLOVE_TLS:-0}
      - FOXGLOVE_TLS_CERT=${FOXGLOVE_TLS_CERT:-/etc/ssl/certs/foxglove_bridge.crt}
      - FOXGLOVE_TLS_KEY=${FOXGLOVE_TLS_KEY:-/etc/ssl/private/foxglove_bridge.key}
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
    depends_on:
      - rosbridge_websocket
    restart: always

  # Camera Driver (CSI, ROS2 raw publisher)
  # camera_cont:
  #   image: ${REGISTRY_HOST}/${IMAGE_OWNER}/camera:${CAMERA_TAG}
  #   container_name: camera_cont
  #   network_mode: host
  #   privileged: true
  #   devices:
  #     - /dev:/dev
  #   environment:
  #     - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
  #     - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
  #     - ROS_NAMESPACE=camera
  #   volumes:
  #     - ./config/camera_info.yaml:/app/camera_info.yaml:ro
  #   restart: always

  # RealSense D455
  realsense_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/realsense:${REALSENSE_TAG}
    container_name: realsense_cont
    network_mode: host
    privileged: true
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - /dev:/dev
      - /sys/bus:/sys/bus
    environment:
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      - RS_CAMERA_NAME=realsense
      - RS_USB_PORT_ID=${REALSENSE_USB_PORT_ID:-}
      - RS_SERIAL=${REALSENSE_SERIAL:-}
      - RS_ENABLE_DEPTH=true
      - RS_ENABLE_COLOR=true
      - RS_ENABLE_INFRA1=false
      - RS_ENABLE_INFRA2=false
      - RS_ENABLE_GYRO=true
      - RS_ENABLE_ACCEL=true
      - RS_UNITE_IMU_METHOD=${RS_UNITE_IMU_METHOD:-linear_interpolation}
      - RS_BASE_FRAME_ID=${RS_BASE_FRAME_ID:-realsense_link}
      - RS_DEPTH_PROFILE=640x480x15
      - RS_COLOR_PROFILE=640x480x15
      - RS_ALIGN_DEPTH=true
      - RS_ENABLE_POINTCLOUD=false
      - RS_COMPRESSED_JPEG_QUALITY=${RS_COMPRESSED_JPEG_QUALITY:-40}
    restart: always


  bag_recorder_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/bag_recorder:${BAG_RECORDER_TAG}
    container_name: bag_recorder_cont
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      - TOPICS_FILE=/config/recorded_topics.yaml
      - BAG_OUTPUT_DIR=/bags
      - MAX_BAG_MB=150
    volumes:
      - ./config/recorded_topics.yaml:/config/recorded_topics.yaml:ro
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - ./bags:/bags
    depends_on:
      - rosbridge_websocket
      - foxglove_bridge
    restart: always

  # File browser â€” browse bags and logs from a web browser.
  # Access at: http://<pi-ip>:8080  (no login required)
  # Shows two folders: bags/ and logs/
  bag_browser:
    image: filebrowser/filebrowser:latest
    container_name: bag_browser_cont
    ports:
      - "8080:80"
    volumes:
      - ./bags:/srv/bags:ro
      - ./logs:/srv/logs:ro
    command: ["--root", "/srv", "--port", "80", "--address", "0.0.0.0", "--noauth"]
    restart: always

  container_log_collector:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/healthcheck:${HEALTHCHECK_TAG}
    container_name: container_log_collector_cont
    environment:
      - TZ=Europe/Zagreb
      - LOG_DIR=/logs
      - LOGGING_CONFIG=/config/logging.yaml
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-stack}
    volumes:
      - ./logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/logging.yaml:/config/logging.yaml:ro
    entrypoint: ["/usr/local/bin/container_log_collector.py"]
    restart: always

  healthcheck_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/healthcheck:${HEALTHCHECK_TAG}
    container_name: healthcheck_cont
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - CYCLONEDDS_URI=${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      - LOG_DIR=/logs
      - LIDAR_DEVICE=${LIDAR_DEVICE:-/dev/ttyUSB0}
      - BRIDGE_SERIAL_DEVICE=${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}
      - CAMERA_DEVICE=${CAMERA_DEVICE:-/dev/video0}
      - HEALTHCHECK_LOG_TO_FILE=0
    depends_on:
      - nav_cont
      - database_cont
      - slam_cont
      - sensor_fusion_cont
      - robot_bridge
    volumes:
      - ./logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
    restart: always


volumes:
  hailo_examples_data: {}





