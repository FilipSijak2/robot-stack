services:

  # Navigation Stack
  nav_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/nav:${NAV_TAG}
    container_name: nav_cont
    network_mode: host
    cpu_shares: 2048  # DWB controller 20Hz + AMCL trebaju brz odgovor
    env_file:
      - ./config/containers/nav_cont.env
    environment:
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      MAP_FILE: ${MAP_FILE:-}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - ./config/containers/nav2_params.yaml:/app/nav2_params.yaml
      - ./config/containers/map.yaml:/app/map.yaml:ro
      - ./srv:/srv
      - /dev/input:/dev/input:ro
    privileged: true
    depends_on:
      - database_cont
      - slam_cont
      - rosbridge_websocket
      - sensor_fusion_cont
      - robot_bridge
    restart: always

  # Database
  database_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/db:${DB_TAG}
    container_name: database_cont
    network_mode: host
    env_file:
      - ./config/containers/database_cont.env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER}
    volumes:
      - ./srv:/srv
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # Laser Driver
  laser_driver:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/laser_driver:${DRIVER_TAG}
    container_name: laser_driver_cont
    cpu_shares: 1024  # LiDAR driver: čitanje podataka kritično za SLAM i Nav2
    env_file:
      - ./config/containers/laser_driver.env
    environment:
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
    devices:
      - "${LIDAR_DEVICE:-/dev/ttyUSB0}:${LIDAR_DEVICE:-/dev/ttyUSB0}"
    group_add:
      - dialout
    network_mode: host
    depends_on:
      - database_cont
    restart: always

  # SLAM
  slam_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/slam:${SLAM_TAG}
    container_name: slam_cont
    network_mode: host
    cpu_shares: 1024  # Loop closure može spikati, ali ne smije gladovati
    depends_on:
      - database_cont
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - ./config/containers/slam_params.yaml:/app/slam_params.yaml
      - ./srv:/srv
      - ./config/containers/static_tf.yaml:/app/static_tf.yaml
    env_file:
      - ./config/containers/slam_cont.env
    environment:
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      DB_NAME: ${DB_NAME}
      DB_PASS: ${DB_PASS}
      DB_USER: ${DB_USER}
      MAP_ROOT: ${MAP_ROOT}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f slam_manager.py >/dev/null || pgrep -f slam_toolbox >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  # Sensor Fusion
  sensor_fusion_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/sensor_fusion:${SENSOR_FUSION_TAG}
    container_name: sensor_fusion_cont
    network_mode: host
    cpu_shares: 2048  # EKF 30Hz — kašnjenje degradira lokalizaciju
    env_file:
      - ./config/containers/sensor_fusion_cont.env
    environment:
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}
      SF_IMU_INPUT_TOPIC: ${SF_IMU_INPUT_TOPIC:-/camera/realsense/imu}
      SF_IMU_OUTPUT_TOPIC: ${SF_IMU_OUTPUT_TOPIC:-/imu/data}
      SF_IMU_SOURCE: ${SF_IMU_SOURCE:-realsense}
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - ./config/containers/robot_localization.yaml:/app/robot_localization.yaml
    depends_on:
      - database_cont
      - realsense_cont
      - slam_cont
      - robot_bridge
    restart: always

  # Robot Bridge (legacy serial mode + optional RPi direct mode)
  robot_bridge:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/bridge:${BRIDGE_TAG}
    container_name: robot_bridge_cont
    network_mode: host
    cpu_shares: 4096  # Najviši prioritet: motor control 50Hz mora biti pouzdan
    env_file:
      - ./config/containers/robot_bridge.env
      - ./config/containers/bridge_rpi_direct.env
    environment:
      BRIDGE_MODE: ${BRIDGE_MODE:-serial_legacy}
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      IMU_TOPIC: ${BRIDGE_IMU_TOPIC:-/imu/arduino}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}
      SERIAL_BAUD: ${BRIDGE_SERIAL_BAUD:-115200}
      SERIAL_PORT: ${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
    devices:
      - "${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}:${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}"
      - "${BRIDGE_I2C_DEVICE:-/dev/i2c-1}:${BRIDGE_I2C_DEVICE:-/dev/i2c-1}"
      - "${BRIDGE_GPIOMEM_DEVICE:-/dev/gpiomem}:${BRIDGE_GPIOMEM_DEVICE:-/dev/gpiomem}"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'pgrep -f \"robot_serial_bridge|robot_rpi_direct_bridge\" >/dev/null || exit 1'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 8s
    restart: always

  # AI Kit
  ai_kit_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/ai_kit:${AI_KIT_TAG}
    container_name: ai_kit_cont
    cpu_shares: 512   # Hailo NPU radi inferenciju hardverski, CPU samo prenosi framove
    env_file:
      - ./config/containers/ai_kit_cont.env
    environment:
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      DISPLAY: ${DISPLAY:-}
      HAILO_GST_PIPELINE: ${HAILO_GST_PIPELINE:-}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID}
      XDG_RUNTIME_DIR: ${XDG_RUNTIME_DIR:-}
    devices:
      - /dev/dri:/dev/dri
      - /dev:/dev
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - /lib/firmware:/lib/firmware
      - /run/udev:/run/udev:ro
      # Hailo runtime from host (installed via 'sudo apt install hailo-all').
      # Mounts the prebuilt libs directly â€” no downloading inside the container.
      - /usr/lib/libhailort.so:/usr/lib/libhailort.so:ro
      - /usr/lib/hailo:/usr/lib/hailo:ro
      - /usr/lib/aarch64-linux-gnu/libhailort.so.4:/usr/lib/aarch64-linux-gnu/libhailort.so.4:ro
      - /usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgsthailo.so:/usr/lib/aarch64-linux-gnu/gstreamer-1.0/libgsthailo.so:ro
      - /usr/lib/python3/dist-packages/hailort:/usr/lib/python3/dist-packages/hailort:ro
      - /usr/lib/python3/dist-packages/hailo_tappas_core_python_binding:/usr/lib/python3/dist-packages/hailo_tappas_core_python_binding:ro
      - hailo_examples_data:/root/hailo-rpi5-examples
    privileged: true
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    group_add:
      - 44
    restart: always

  # ROS Bridge WebSocket
  rosbridge_websocket:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/rosbridge:${ROSBRIDGE_TAG}
    container_name: rosbridge_websocket_cont
    cpu_shares: 256   # Vizualizacija: ne smije uzimati CPU od navstacka
    env_file:
      - ./config/containers/rosbridge_websocket.env
    environment:
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
    network_mode: host
    restart: always

  # Foxglove Bridge (WebSocket UI endpoint)
  foxglove_bridge:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/foxglove_bridge:${FOXGLOVE_BRIDGE_TAG}
    container_name: foxglove_bridge_cont
    network_mode: host
    cpu_shares: 256   # Vizualizacija: najniži prioritet od kritičnih servisa
    env_file:
      - ./config/containers/foxglove_bridge.env
    environment:
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
    depends_on:
      - rosbridge_websocket
    restart: always

  # Camera Driver (CSI, ROS2 raw publisher)
  # camera_cont:
  #   image: ${REGISTRY_HOST}/${IMAGE_OWNER}/camera:${CAMERA_TAG}
  #   container_name: camera_cont
  #   network_mode: host
  #   privileged: true
  #   devices:
  #     - /dev:/dev
  #   environment:
  #     - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
  #     - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
  #     - ROS_NAMESPACE=camera
  #   volumes:
  #     - ./config/containers/camera_info.yaml:/app/camera_info.yaml:ro
  #   restart: always

  # RealSense D455
  realsense_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/realsense:${REALSENSE_TAG}
    container_name: realsense_cont
    network_mode: host
    cpu_shares: 512   # USB DMA uglavnom kernelski, ali encoding pointclouda treba CPU
    privileged: true
    volumes:
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - /dev:/dev
      - /sys/bus:/sys/bus
    env_file:
      - ./config/containers/realsense_cont.env
    environment:
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RS_COMPRESSED_JPEG_QUALITY: ${RS_COMPRESSED_JPEG_QUALITY:-40}
      RS_SERIAL: ${REALSENSE_SERIAL:-}
      RS_UNITE_IMU_METHOD: ${RS_UNITE_IMU_METHOD:-linear_interpolation}
      RS_USB_PORT_ID: ${REALSENSE_USB_PORT_ID:-}
    restart: always


  bag_recorder_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/bag_recorder:${BAG_RECORDER_TAG}
    container_name: bag_recorder_cont
    network_mode: host
    env_file:
      - ./config/containers/bag_recorder_cont.env
    environment:
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - ./config/containers/recorded_topics.yaml:/config/recorded_topics.yaml:ro
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
      - ./bags:/bags
    depends_on:
      - rosbridge_websocket
      - foxglove_bridge
    restart: always

  # File browser â€” browse bags and logs from a web browser.
  # Access at: http://<pi-ip>:8080  (no login required)
  # Shows two folders: bags/ and logs/
  bag_browser:
    image: filebrowser/filebrowser:latest
    container_name: bag_browser_cont
    ports:
      - "8080:80"
    volumes:
      - ./bags:/srv/bags:ro
      - ./logs:/srv/logs:ro
    command: ["--root", "/srv", "--port", "80", "--address", "0.0.0.0", "--noauth"]
    restart: always

  container_log_collector:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/healthcheck:${HEALTHCHECK_TAG}
    container_name: container_log_collector_cont
    env_file:
      - ./config/containers/container_log_collector.env
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-stack}
    volumes:
      - ./logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/containers/logging.yaml:/config/logging.yaml:ro
    entrypoint: ["/usr/local/bin/container_log_collector.py"]
    restart: always

  healthcheck_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/healthcheck:${HEALTHCHECK_TAG}
    container_name: healthcheck_cont
    network_mode: host
    env_file:
      - ./config/containers/healthcheck_cont.env
    environment:
      BRIDGE_SERIAL_DEVICE: ${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}
      CAMERA_DEVICE: ${CAMERA_DEVICE:-/dev/video0}
      CYCLONEDDS_URI: ${CYCLONEDDS_URI:-file:///etc/ros/cyclonedds.xml}
      LIDAR_DEVICE: ${LIDAR_DEVICE:-/dev/ttyUSB0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    depends_on:
      - nav_cont
      - database_cont
      - slam_cont
      - sensor_fusion_cont
      - robot_bridge
    volumes:
      - ./logs:/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /dev:/dev:ro
      - /run/udev:/run/udev:ro
      - ./config/cyclonedds.xml:/etc/ros/cyclonedds.xml:ro
    restart: always
volumes:
  hailo_examples_data: {}
