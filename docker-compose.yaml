version: '3.9'
services:
  nav_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/nav:${NAV_TAG}
    container_name: nav_cont
    network_mode: host  # ROS 2 koristi DDS, koji zahtijeva host mrežu
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    volumes:
      - ./config/nav2_params.yaml:/app/nav2_params.yaml
      - ./srv:/srv  # Map storage
    depends_on:
      - database_cont
      - slam_cont
      - rosbridge_websocket
      - sensor_fusion_cont
      - robot_bridge
    restart: always

  database_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/db:${DB_TAG}
    container_name: database_cont
    network_mode: host
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /srv/db
    volumes:
      - ./srv:/srv
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  laser_driver:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/laser_driver:${DRIVER_TAG}
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0  # Mora biti isti kao u rosbridge_websocket
    container_name: laser_driver_cont
    devices:
      - "${LIDAR_DEVICE:-/dev/ttyUSB0}:${LIDAR_DEVICE:-/dev/ttyUSB0}"  # Mapiranje serijskog uređaja
    network_mode: host  # ROS 2 koristi DDS, koji zahtijeva host mrežu
    depends_on:
      - database_cont
    restart: always

  slam_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/slam:${SLAM_TAG}
    container_name: slam_cont
    network_mode: host  # ROS 2 zahtijeva host mrežu
    depends_on:
      - database_cont
    volumes:
      - ./config/slam_params.yaml:/app/slam_params.yaml  # Konfiguracija
      - ./srv:/srv  # Trajni podaci (maps & ostalo)
      - ./config/static_tf.yaml:/app/static_tf.yaml  # Static TF definicije
    environment:
      - MAP_ROOT=${MAP_ROOT}
      - DB_HOST=localhost
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - STATIC_TF_FILE=/app/static_tf.yaml
      - PUBLISH_LASER_STATIC_TF=0  # YAML already defines needed TF; set 1 to add ad-hoc single TF
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f slam_toolbox >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  webui:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/webui:${WEBUI_TAG}
    container_name: webui_cont
    ports:
      - "8080:80"
    environment:
      - VITE_ROSBRIDGE_URL=${VITE_ROSBRIDGE_URL:-ws://${PUBLIC_HOST:-localhost}:9090}
      - VITE_ROBOT_NAME=${VITE_ROBOT_NAME:-Devastator}
    depends_on:
      - rosbridge_websocket
    restart: always
    profiles:
      - ${ENABLE_WEBUI_PROFILE:-webui}
    # No host network needed; browser reaches rosbridge on host:9090 via tailnet/local IP

  rosbridge_websocket:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/rosbridge:${ROSBRIDGE_TAG}
    container_name: rosbridge_websocket_cont
    environment:
      - ROS_DOMAIN_ID=0  # Postavi isti ROS_DOMAIN_ID za sve containere
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    network_mode: host  # ROS 2 koristi DDS, koji zahtijeva host mrežu (port 9090 dostupan preko host-a)
    restart: always

  sensor_fusion_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/sensor_fusion:${SENSOR_FUSION_TAG}
    container_name: sensor_fusion_cont
    network_mode: host
    restart: always
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    volumes:
      - ./config/robot_localization.yaml:/app/robot_localization.yaml
    depends_on:
      - database_cont
      - slam_cont
      - robot_bridge

  robot_bridge:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/bridge:${BRIDGE_TAG}
    container_name: robot_bridge_cont
    network_mode: host  # DDS discovery + low latency
    environment:
      - SERIAL_PORT=${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}
      - SERIAL_BAUD=${BRIDGE_SERIAL_BAUD:-115200}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    devices:
      - "${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}:${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'pgrep -f robot_serial_bridge >/dev/null || exit 1'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 8s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.10'
    # NOTE: If you want to build locally instead of pulling from registry, uncomment below:
    # build: ../bridge_cont

  ai_kit_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/ai-kit:${AI_KIT_TAG}
    container_name: ai_kit_cont
    environment:
      - DISPLAY=${DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - UDEV=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    devices:
      - /dev/dri:/dev/dri
      - /dev:/dev
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - /lib/firmware:/lib/firmware
      - /run/udev:/run/udev:ro
    privileged: true
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    group_add:
      - 44
    restart: unless-stopped
    profiles:
      - ${ENABLE_AI_KIT_PROFILE:-ai_kit}

volumes: {}

# Protected files helper:
# See config/protected-files.txt and run config/apply-protected-files.sh after cloning

