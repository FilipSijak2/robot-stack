version: '3.9'
services:
  nav_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/nav:${NAV_TAG}
    container_name: nav_cont
    network_mode: host  # ROS 2 koristi DDS, koji zahtijeva host mrežu
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    volumes:
      - ./config/nav2_params.yaml:/app/nav2_params.yaml
      - ./srv:/srv  # Map storage
    depends_on:
      - database_cont
      - slam_cont
      - rosbridge_websocket
      - sensor_fusion_cont
      - robot_bridge
    restart: always

  database_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/db:${DB_TAG}
    container_name: database_cont
    network_mode: host
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /srv/db
    volumes:
      - ./srv:/srv
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  laser_driver:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/driver:${DRIVER_TAG}
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0  # Mora biti isti kao u rosbridge_websocket
    container_name: laser_driver_cont
    devices:
      - "${LIDAR_DEVICE:-/dev/ttyUSB0}:${LIDAR_DEVICE:-/dev/ttyUSB0}"  # Mapiranje serijskog uređaja
    network_mode: host  # ROS 2 koristi DDS, koji zahtijeva host mrežu
    depends_on:
      - database_cont
    restart: always

  slam_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/slam:${SLAM_TAG}
    container_name: slam_cont
    network_mode: host  # ROS 2 zahtijeva host mrežu
    depends_on:
      - database_cont
    volumes:
      - ./config/slam_params.yaml:/app/slam_params.yaml  # Konfiguracija
      - ./srv:/srv  # Trajni podaci (maps & ostalo)
    environment:
      - MAP_ROOT=${MAP_ROOT}
      - DB_HOST=localhost
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f slam_toolbox >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  rosbridge_websocket:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/rosbridge:${ROSBRIDGE_TAG}
    container_name: rosbridge_websocket_cont
    environment:
      - ROS_DOMAIN_ID=0  # Postavi isti ROS_DOMAIN_ID za sve containere
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    ports:
      - "9090:9090"  # Standardni port za rosbridge websocket
    network_mode: host  # ROS 2 koristi DDS, koji zahtijeva host mrežu
    restart: always

  sensor_fusion_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/sensor_fusion:${SENSOR_FUSION_TAG}
    container_name: sensor_fusion_cont
    network_mode: host
    restart: always
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    volumes:
      - ./config/robot_localization.yaml:/app/robot_localization.yaml
    depends_on:
      - database_cont
      - slam_cont
      - robot_bridge

  robot_bridge:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/bridge:${BRIDGE_TAG}
    container_name: robot_bridge_cont
    network_mode: host  # DDS discovery + low latency
    environment:
      - SERIAL_PORT=${BRIDGE_SERIAL_DEVICE:-/dev/ttyUSB1}
      - SERIAL_BAUD=${BRIDGE_SERIAL_BAUD:-115200}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    devices:
      - "${BRIDGE_SERIAL_DEVICE:-/dev/ttyUSB1}:${BRIDGE_SERIAL_DEVICE:-/dev/ttyUSB1}"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'pgrep -f robot_serial_bridge >/dev/null || exit 1'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 8s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.10'
    # NOTE: If you want to build locally instead of pulling from registry, uncomment below:
    # build: ../bridge_cont

volumes: {}

