version: '3.9'

services:

  # Navigation Stack
  nav_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/nav:${NAV_TAG}
    container_name: nav_cont
    network_mode: host
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    volumes:
      - ./config/nav2_params.yaml:/app/nav2_params.yaml
      - ./srv:/srv
    depends_on:
      - database_cont
      - slam_cont
      - rosbridge_websocket
      - sensor_fusion_cont
      - robot_bridge
    restart: always

  # Database
  database_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/db:${DB_TAG}
    container_name: database_cont
    network_mode: host
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /srv/db
    volumes:
      - ./srv:/srv
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # Laser Driver
  laser_driver:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/laser_driver:${DRIVER_TAG}
    container_name: laser_driver_cont
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    devices:
      - "${LIDAR_DEVICE:-/dev/ttyUSB0}:${LIDAR_DEVICE:-/dev/ttyUSB0}"
    network_mode: host
    depends_on:
      - database_cont
    restart: always

  # SLAM
  slam_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/slam:${SLAM_TAG}
    container_name: slam_cont
    network_mode: host
    depends_on:
      - database_cont
    volumes:
      - ./config/slam_params.yaml:/app/slam_params.yaml
      - ./srv:/srv
      - ./config/static_tf.yaml:/app/static_tf.yaml
    environment:
      - MAP_ROOT=${MAP_ROOT}
      - DB_HOST=localhost
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - STATIC_TF_FILE=/app/static_tf.yaml
      - PUBLISH_LASER_STATIC_TF=0
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f slam_toolbox >/dev/null || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5

  # Sensor Fusion
  sensor_fusion_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/sensor_fusion:${SENSOR_FUSION_TAG}
    container_name: sensor_fusion_cont
    network_mode: host
    restart: always
    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
    volumes:
      - ./config/robot_localization.yaml:/app/robot_localization.yaml
    depends_on:
      - database_cont
      - slam_cont
      - robot_bridge

  # Robot Serial Bridge
  robot_bridge:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/bridge:${BRIDGE_TAG}
    container_name: robot_bridge_cont
    network_mode: host
    environment:
      - SERIAL_PORT=${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}
      - SERIAL_BAUD=${BRIDGE_SERIAL_BAUD:-115200}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    devices:
      - "${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}:${BRIDGE_SERIAL_DEVICE:-/dev/ttyACM0}"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'pgrep -f robot_serial_bridge >/dev/null || exit 1'"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 8s

  # AI Kit
  ai_kit_cont:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/ai-kit:${AI_KIT_TAG}
    container_name: ai_kit_cont
    environment:
      - DISPLAY=${DISPLAY}
      - XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}
      - UDEV=1
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    devices:
      - /dev/dri:/dev/dri
      - /dev:/dev
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev:/dev
      - /lib/firmware:/lib/firmware
      - /run/udev:/run/udev:ro
    privileged: true
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    group_add:
      - 44
    restart: unless-stopped

  # ROS Bridge WebSocket
  rosbridge_websocket:
    image: ${REGISTRY_HOST}/${IMAGE_OWNER}/rosbridge:${ROSBRIDGE_TAG}
    container_name: rosbridge_websocket_cont
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    network_mode: host
    restart: always

# Camera Driver (CSI, ROS2 raw publisher)
camera_cont:
  image: ${REGISTRY_HOST}/${IMAGE_OWNER}/camera:${CAMERA_TAG}
  container_name: camera_cont
  network_mode: host
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
    - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
    - CAMERA_WIDTH=${CAMERA_WIDTH}
    - CAMERA_HEIGHT=${CAMERA_HEIGHT}
    - CAMERA_FPS=${CAMERA_FPS}
    - CAMERA_PIPELINE=csi  # CSI pipeline
    - CAMERA_FORMAT=raw    # RAW feed za ROS2
  devices:
    - ${CAMERA_DEV_VIDEO0:-/dev/video0}:${CAMERA_DEV_VIDEO0:-/dev/video0}
    - ${CAMERA_DEV_VCHIQ:-/dev/vchiq}:${CAMERA_DEV_VCHIQ:-/dev/vchiq}
    - ${CAMERA_DEV_MEDIA0:-/dev/media0}:${CAMERA_DEV_MEDIA0:-/dev/media0}
    - ${CAMERA_DEV_MEDIA1:-/dev/media1}:${CAMERA_DEV_MEDIA1:-/dev/media1}
  volumes:
    - ./config/camera_info.yaml:/app/camera_info.yaml:ro
    - /opt/ros/humble:/opt/ros/humble:ro   # mount host ROS 2
    - /tmp/.ros:/tmp/.ros                  # ROS2 cache folder
  restart: always
  depends_on:
    - rosbridge_websocket

volumes: {}


